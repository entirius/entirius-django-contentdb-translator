[project]
name = "entirius-django-contentdb-translator"
version = "2.0.1"
description = "AI translation of ContentDB pages, navigation and authors for Entirius, as new language drafts"
keywords = ["django", "cms", "content", "translation", "ai", "localization", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.0",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "celery>=5.0",
    "entirius-django-contentdb>=5.0.0",
    "entirius-django-regional>=2.0.1",
    "entirius-django-utils>=2.0.0",
    "entirius-django-utils-translator>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-contentdb-translator/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-contentdb-translator"
Changelog = "https://github.com/entirius/entirius-django-contentdb-translator/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-contentdb-translator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_contentdb_translator"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
# Legacy migrated 1:1
"src/django_contentdb_translator/admin/**" = ["S110"]
"src/django_contentdb_translator/services/**" = ["B007", "F402", "S110"]
"src/django_contentdb_translator/tasks/**" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["django_contentdb_translator"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
