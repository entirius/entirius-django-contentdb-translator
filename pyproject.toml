[project]
name = "entirius-django-contentdb-translator"
version = "2.0.0"
description = "ContentDB AI translation — clones drafts with translated content via AI toolbox"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.0",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "celery>=5.0",
    "entirius-django-contentdb>=5.0.0",
    "entirius-django-regional>=2.0.1",
    "entirius-django-utils>=2.0.0",
    "entirius-django-utils-translator>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-contentdb-translator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_contentdb_translator"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
# Legacy migrated 1:1
"src/django_contentdb_translator/admin/**" = ["S110"]
"src/django_contentdb_translator/services/**" = ["B007", "F402", "S110"]
"src/django_contentdb_translator/tasks/**" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["django_contentdb_translator"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
